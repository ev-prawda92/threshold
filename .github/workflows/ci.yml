name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Documented commands run on a clean checkout
        run: |
          python -m threshold seed
          python -m threshold score senior-staff-product-and-program-manager
          python -m threshold audit senior-staff-product-and-program-manager
          python -m threshold eval
